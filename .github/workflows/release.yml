name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate:release
      - run: npm run build:web
      - name: Archive web build
        run: tar -czf "Depthmap-Studio-web-${GITHUB_REF_NAME#v}.tar.gz" web-dist
      - uses: actions/upload-artifact@v4
        with:
          name: web-release
          path: Depthmap-Studio-web-*.tar.gz

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:smoke
      - run: CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/Depthmap-Studio-*.dmg

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
            VCS_REF=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: |
            ghcr.io/suyaleo/depthmap-studio:${{ steps.version.outputs.value }}
            ghcr.io/suyaleo/depthmap-studio:sha-${{ github.sha }}
            ghcr.io/suyaleo/depthmap-studio:latest
      - name: Verify anonymous pull
        run: |
          docker logout ghcr.io
          for attempt in $(seq 1 20); do
            if docker pull "ghcr.io/suyaleo/depthmap-studio:${{ steps.version.outputs.value }}"; then
              exit 0
            fi
            sleep 3
          done
          exit 1

  github-release:
    needs: [web, macos, container]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-release'
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Depthmap-Studio-web-*.tar.gz
            Depthmap-Studio-*.dmg
