services:
  depthmap-studio:
    image: ghcr.io/suyaleo/depthmap-studio:${APP_VERSION:-1.0.0}
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-1.0.0}
        VCS_REF: ${VCS_REF:-development}
        SOURCE_URL: https://github.com/suyaleo/Depthmap_Studio
    container_name: depthmap-studio
    restart: unless-stopped
    ports:
      - "${DEPTHMAP_STUDIO_PORT:-8790}:8790"
    volumes:
      - depthmap-studio-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8790/api/health"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 5s

volumes:
  depthmap-studio-data:
